name: google-workspace
version: 0.1.0
manifest_version: 2
api_version: 1
description: >-
  Google Workspace for Hermes: a native desktop workspace plus agent tools for Gmail,
  Calendar, Drive, Docs, Sheets and Contacts. Read across apps, prepare meeting briefs,
  turn email into calendar events, collect invoices into Sheets, and organize Drive —
  with every consequential write gated by Hermes approval.
author: Franco Leff
license: MIT
tags: [google, gmail, calendar, drive, docs, sheets, productivity]

# Lowest Hermes release with the pieces this plugin needs: the plugin OAuth flow (first stable tag
# v0.22.3) and the desktop SDK surface it imports. Verified with `hermes plugins validate` on 0.22.7.
requires_hermes: ">=0.22.3"

# Declared surface. `hermes plugins validate` fails if register(ctx) adds anything not listed here.
provides_tools:
  - google_search
  - google_gmail_search
  - google_gmail_read
  - google_gmail_send
  - google_gmail_draft
  - google_gmail_modify
  - google_calendar_agenda
  - google_calendar_create_event
  - google_calendar_check_availability
  - google_drive_search
  - google_drive_create_folder
  - google_drive_move
  - google_docs_read
  - google_docs_create
  - google_docs_append
  - google_sheets_read
  - google_sheets_create
  - google_sheets_append
  - google_contacts_search
  - google_contacts_create
  - google_meeting_brief
  - google_email_to_event
  - google_invoices_to_sheet
  - google_organize_drive
  - google_calendar_search
  - google_calendar_update_event
  - google_calendar_cancel_event
  - google_calendar_rsvp
  - google_gmail_update_draft
  - google_gmail_forward
  - google_docs_replace_text
  - google_sheets_metadata
  - google_sheets_update_range
  - google_sheets_create_tab
  - google_contacts_update
  - google_drive_get
  - google_drive_rename
  - google_drive_share
provides_hooks:
  - pre_tool_call

# Google owns the OAuth flow. Hermes stores and refreshes the grant; the plugin never
# sees the access token, refresh token or client secret. The user signs in once from a
# terminal: `hermes auth add google-workspace:google`.
#
# Both variables are optional so the plugin still loads (and can explain setup) before
# the user creates a Google Cloud OAuth client.
optional_env:
  - name: GOOGLE_WORKSPACE_CLIENT_ID
    description: "OAuth client ID from a Google Cloud project (Desktop app client type)"
    password: false
  - name: GOOGLE_WORKSPACE_CLIENT_SECRET
    description: "OAuth client secret from the same Google Cloud Desktop app client"
    password: true

oauth:
  - id: google
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      # Read mail, change its labels (read/unread, star, archive), send and draft as the
      # user. gmail.modify includes read access. Narrower than https://mail.google.com/,
      # which is never requested.
      - https://www.googleapis.com/auth/gmail.modify
      - https://www.googleapis.com/auth/gmail.send
      - https://www.googleapis.com/auth/gmail.compose
      - https://www.googleapis.com/auth/calendar.events
      # Drive needs broad visibility to search existing files and to move them into
      # folders; drive.file would only see files this app created.
      - https://www.googleapis.com/auth/drive
      - https://www.googleapis.com/auth/documents
      - https://www.googleapis.com/auth/spreadsheets
      # Read contacts and create them. Creating needs write access; no narrower scope exists.
      - https://www.googleapis.com/auth/contacts
    client_id_env: GOOGLE_WORKSPACE_CLIENT_ID
    client_secret_env: GOOGLE_WORKSPACE_CLIENT_SECRET
    hosts:
      - www.googleapis.com
      - gmail.googleapis.com
      - docs.googleapis.com
      - sheets.googleapis.com
      - people.googleapis.com
    # Google only returns a refresh token with access_type=offline, and only
    # re-consents when prompt=consent.
    authorize_params: {access_type: offline, prompt: consent}
