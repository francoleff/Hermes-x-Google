# DRAFT catalog entry. Not submitted.
#
# Hermes's catalog accepts one file, plugin-catalog/<name>.yaml, by pull request to
# NousResearch/hermes-agent. Before that PR can be opened, all of these must be true:
#   1. The repository is public on GitHub or GitLab, and `repo` below points at it.
#   2. `sha` is the full 40-character commit that was validated (hermes plugins validate).
#   3. The owner has approved publication. Nothing here is pushed or posted automatically.
#
# Placeholders in angle brackets must be replaced. Remove this comment block before the PR.

name: google-workspace
repo: https://github.com/<owner>/google-workspace-hermes
sha: <40-character commit sha>
description: Gmail, Calendar, Drive, Docs, Sheets and Contacts in one Hermes workspace, with cross-app briefs and approval on every write.
maintainer: <github-handle>
tier: community
category: desktop
requires_hermes: ">=0.22.3"
version: "0.1.0"
title: Google Workspace
readme: true
platforms: []
known_issues:
  - Not yet verified against a live Google account. Run the README's live check before relying on it.
  - Sign-in is a terminal command (hermes auth add google-workspace:google), not an in-app flow.
  - Sensitive and restricted Google scopes need Google's app verification before public sign-in.
capabilities:
  provides_tools:
    - google_search
    - google_gmail_search
    - google_gmail_read
    - google_gmail_send
    - google_gmail_draft
    - google_gmail_modify
    - google_calendar_agenda
    - google_calendar_create_event
    - google_calendar_check_availability
    - google_drive_search
    - google_drive_create_folder
    - google_drive_move
    - google_docs_read
    - google_docs_create
    - google_docs_append
    - google_sheets_read
    - google_sheets_create
    - google_sheets_append
    - google_contacts_search
    - google_contacts_create
    - google_meeting_brief
    - google_email_to_event
    - google_invoices_to_sheet
    - google_organize_drive
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - GOOGLE_WORKSPACE_CLIENT_ID
    - GOOGLE_WORKSPACE_CLIENT_SECRET
